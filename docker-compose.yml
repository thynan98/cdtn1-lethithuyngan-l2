# Chạy: cp .env.example .env   rồi   docker compose up -d --build
# Sau đó mở http://localhost:8000
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db          # giữ dữ liệu khi container bị xóa
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: warranty
      # Lấy từ .env (sao chép từ .env.example); không có giá trị mặc định trong repo.
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET - chạy "cp .env.example .env" trước}
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data: